<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="フルネームを見やすく扱う一画面完結の席替えツール"><title>スマート席替え Pro</title><style>
:root{--navy:#102f55;--blue:#1765b4;--line:#d6e1ed;--pale:#eef6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4f8fc,#eef5fb);font-family:"Yu Gothic UI",Meiryo,sans-serif;color:#152434}main{max-width:1100px;margin:auto;padding:28px 16px}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}h1{margin:0;color:var(--navy);font-size:clamp(1.65rem,4vw,2.35rem)}header p{margin:7px 0 0;color:#627286}.badge{background:var(--navy);color:white;padding:8px 12px;border-radius:99px;font-size:.9rem;font-weight:bold;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(270px,.8fr) minmax(430px,1.2fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px #23405c12;padding:18px}h2{font-size:1.08rem;margin:0 0 14px}label{display:block;font-size:.85rem;font-weight:bold;margin:10px 0 6px}textarea,input{font:inherit;border:1px solid #b9c8d9;border-radius:9px;padding:10px;width:100%}textarea{height:245px;resize:vertical;line-height:1.6}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:9px;padding:11px 13px;font:inherit;font-weight:bold;cursor:pointer;background:#e7eff8;color:var(--navy)}button.primary{width:100%;margin-top:15px;background:var(--blue);color:white}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(78px,1fr));gap:10px;margin-top:12px}.seat{min-height:72px;border:1px solid #d5e0ec;border-radius:11px;padding:9px;background:linear-gradient(145deg,#fff,#f5f9fd);display:flex;flex-direction:column;justify-content:space-between;overflow-wrap:anywhere}.seat small{color:var(--blue);font-weight:bold}.seat b{font-size:.94rem}.empty{border-style:dashed;color:#8392a1;background:#f8fafc}footer{text-align:center;color:#718194;font-size:.78rem;margin:18px}@media(max-width:720px){header{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(var(--cols,3),minmax(70px,1fr));gap:7px}.seat{min-height:64px;padding:7px}.seat b{font-size:.82rem}}
</style></head><body><main><header><div><h1>スマート席替え Pro</h1><p>一画面で完結。フルネームを見失わない席替えツール。</p></div><span class="badge" id="count">名簿 0名</span></header><section class="layout"><div class="card"><h2>名簿</h2><label for="names">氏名（1行に1名）</label><textarea id="names" placeholder="例：山田 花子&#10;佐藤 太郎&#10;鈴木 美咲"></textarea><p style="font-size:.8rem;color:#637286;line-height:1.5">姓と名の間の空白や敬称を、そのまま表示します。</p><div class="settings"><div><label for="cols">列数</label><input id="cols" type="number" min="1" max="12" value="4"></div><div><label for="empty">空席数</label><input id="empty" type="number" min="0" max="30" value="0"></div></div><button class="primary" id="shuffle">席替えを実行</button></div><div class="card"><div class="head"><h2>座席表</h2><button id="copy">座席表をコピー</button></div><div class="grid" id="grid" style="--cols:4"><div class="seat empty"><small>READY</small><b>名簿を入力すると<br>ここに表示されます</b></div></div></div></section><footer>データはこの端末のブラウザ内だけで処理されます。</footer></main><script>
const q=id=>document.getElementById(id),names=q('names'),grid=q('grid');function list(){return names.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function render(a){let c=Math.max(1,Math.min(12,+q('cols').value||4)),e=Math.max(0,+q('empty').value||0);grid.style.setProperty('--cols',c);let all=a.concat(Array(e).fill(''));grid.innerHTML=all.map((n,i)=>'<div class="seat '+(n?'':'empty')+'"><small>'+String(i+1).padStart(2,'0')+'</small><b>'+ (n||'空席')+'</b></div>').join('')||'<div class="seat empty"><small>READY</small><b>名簿を入力すると<br>ここに表示されます</b></div>'}function update(){q('count').textContent='名簿 '+list().length+'名'}names.oninput=update;q('shuffle').onclick=()=>{let a=list();if(!a.length){alert('氏名を1行ずつ入力してください。');return}for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}render(a)};q('cols').onchange=()=>render(list());q('empty').onchange=()=>render(list());q('copy').onclick=()=>navigator.clipboard.writeText([...grid.children].map(x=>x.innerText).join('\n')).then(()=>alert('座席表をコピーしました。'));
</script></body></html>
